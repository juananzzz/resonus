name: Bug report
description: Something isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Resonus version
      description: Under Settings › About. If it isn't the latest [release](https://github.com/juananzzz/resonus/releases), please try that one first.
      placeholder: "0.8.5"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: The iOS build is unsigned and sideloaded, so parts of it behave differently. Saying which one you are on saves a round trip.
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Description
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Tap…
        3. See…
    validations:
      required: false
  - type: dropdown
    id: server
    attributes:
      label: Server
      description: Pick every one you use. If it only goes wrong on one of them, say so in the description.
      multiple: true
      options:
        - Navidrome
        - Jellyfin
        - Ampache
        - Other OpenSubsonic
        - Local (no server)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Android or iOS version
      description: "Optional, but it settles a lot of bugs on its own. Under Settings › About phone on Android, or Settings › General › About on iOS."
      placeholder: "Android 14, or iOS 18.5"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Phone model
      description: "Optional. On Android, if you run a custom ROM (LineageOS, GrapheneOS, crDroid…), please say which one and which version. They change how playback in the background, battery optimization and permissions behave."
      placeholder: "Pixel 7a, iPhone 13, or Pixel 7a on GrapheneOS 2026041000"
    validations:
      required: false
  - type: dropdown
    id: connectivity
    attributes:
      label: Mode
      description: Optional. Whether it goes wrong with a connection, with "Offline mode" on in Settings, or either way.
      options:
        - "Online"
        - "Offline"
        - "Both"
    validations:
      required: false
