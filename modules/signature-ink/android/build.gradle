plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.signatureink'
version = '0.0.1'

android {
  namespace 'expo.modules.signatureink'
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
  testOptions.unitTests.includeAndroidResources = true
  sourceSets.test.resources.srcDir '../../../test/fixtures/signatures'
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
